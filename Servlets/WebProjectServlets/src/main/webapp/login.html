<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Student Portal</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainNavbar" aria-controls="mainNavbar"
                aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="index.html#services">Services</a></li>
                <li class="nav-item"><a class="nav-link" href="index.html#about">About Us</a></li>
                <li class="nav-item"><a class="nav-link" href="index.html#contact">Contact Us</a></li>
            </ul>
            <a href="register.html" class="btn btn-primary ms-lg-3 mt-3 mt-lg-0">Register</a>
        </div>
    </div>
</nav>

<main class="form-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-7 col-lg-5">
                <section class="form-card">
                    <div class="text-center mb-4">
                        <div class="login-icon" aria-hidden="true">👤</div>
                        <p class="eyebrow">WELCOME BACK</p>
                        <h1 class="h2 fw-bold">Login to Your Account</h1>
                        <p class="text-muted mb-0">Enter your credentials to continue.</p>
                    </div>

                    <!-- Create LoginController and map it to /LoginController in your Servlet project. -->
                    <form method="post" action="LoginController">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" name="username"
                                   placeholder="Enter your username" autocomplete="username" required>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password"
                                   placeholder="Enter your password" autocomplete="current-password" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 form-submit-btn">LOGIN</button>
                    </form>

                    <p class="text-center mt-4 mb-0">
                        Don't have an account?
                        <a href="register.html" class="text-link">Register now</a>
                    </p>
                    <p class="text-center mt-3 mb-0">
                        <a href="index.html" class="back-link">← Back to Home</a>
                    </p>
                </section>
            </div>
        </div>
    </div>
</main>

<footer class="site-footer bg-dark text-white text-center py-3">
    <small>&copy; 2026 Student Portal. All Rights Reserved.</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
